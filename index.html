<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Anthony Garcia, software developer and CS student working in reinforcement learning, robotics simulation, and machine learning from first principles."
    />
    <title>Anthony Garcia · Software Developer · RL Research</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Anthony Garcia" />
    <meta
      property="og:description"
      content="Software developer and CS student working in reinforcement learning, robotics simulation, and machine learning from first principles."
    />
    <meta property="og:type" content="website" />
    <script>
      // Set the theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
